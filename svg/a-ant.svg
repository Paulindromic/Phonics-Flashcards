<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0E6"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Fredoka', 'Nunito', 'Quicksand', sans-serif; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="5" y="5" width="410" height="510" rx="28" ry="28"
        fill="url(#bgGrad)" stroke="#FF6B8A" stroke-width="5"/>

  <!-- Decorative dots -->
  <circle cx="36" cy="36" r="10" fill="#FF6B8A" opacity="0.25"/>
  <circle cx="391" cy="30" r="7" fill="#FF6B8A" opacity="0.18"/>
  <circle cx="36" cy="496" r="6" fill="#FF6B8A" opacity="0.15"/>
  <circle cx="394" cy="498" r="9" fill="#FF6B8A" opacity="0.2"/>

  <!-- Large letter -->
  <text x="210" y="230" text-anchor="middle" dominant-baseline="central"
        font-size="220" font-weight="700" fill="#C2185B">a</text>

  <!-- Divider line -->
  <line x1="126" y1="310" x2="294" y2="310" stroke="#FF6B8A" stroke-width="4"
        stroke-linecap="round" opacity="0.4"/>

  <!-- Word with emphasized first letter -->
  <text x="210" y="390" text-anchor="middle" dominant-baseline="central"
        font-size="56" font-weight="600" fill="#C2185B">
    <tspan font-weight="800" font-size="64">A</tspan>nt
  </text>

  <!-- Simple ant illustration -->
  <g transform="translate(210, 462)">
    <!-- Body segments -->
    <ellipse cx="18" cy="0" rx="10" ry="8" fill="#4E342E"/>
    <ellipse cx="0" cy="0" rx="8" ry="7" fill="#5D4037"/>
    <ellipse cx="-16" cy="-2" rx="7" ry="6" fill="#4E342E"/>
    <!-- Head -->
    <circle cx="-26" cy="-4" r="6" fill="#5D4037"/>
    <!-- Eyes -->
    <circle cx="-28" cy="-6" r="1.5" fill="white"/>
    <circle cx="-24" cy="-6" r="1.5" fill="white"/>
    <circle cx="-28" cy="-6" r="0.8" fill="black"/>
    <circle cx="-24" cy="-6" r="0.8" fill="black"/>
    <!-- Antennae -->
    <line x1="-28" y1="-10" x2="-35" y2="-22" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-35" cy="-23" r="1.5" fill="#5D4037"/>
    <line x1="-24" y1="-10" x2="-19" y2="-22" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-19" cy="-23" r="1.5" fill="#5D4037"/>
    <!-- Legs -->
    <line x1="-12" y1="2" x2="-18" y2="14" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="4" x2="-8" y2="14" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="5" x2="2" y2="14" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="5" x2="10" y2="14" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="4" x2="20" y2="14" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="2" x2="30" y2="14" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
