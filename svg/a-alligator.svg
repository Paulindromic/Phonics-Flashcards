<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0E6"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Fredoka', 'Nunito', 'Quicksand', sans-serif; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="5" y="5" width="410" height="510" rx="28" ry="28"
        fill="url(#bgGrad)" stroke="#FF6B8A" stroke-width="5"/>

  <!-- Decorative dots -->
  <circle cx="36" cy="36" r="10" fill="#FF6B8A" opacity="0.25"/>
  <circle cx="391" cy="30" r="7" fill="#FF6B8A" opacity="0.18"/>
  <circle cx="36" cy="496" r="6" fill="#FF6B8A" opacity="0.15"/>
  <circle cx="394" cy="498" r="9" fill="#FF6B8A" opacity="0.2"/>

  <!-- Large letter -->
  <text x="210" y="220" text-anchor="middle" dominant-baseline="central"
        font-size="220" font-weight="700" fill="#C2185B">a</text>

  <!-- Divider line -->
  <line x1="126" y1="300" x2="294" y2="300" stroke="#FF6B8A" stroke-width="4"
        stroke-linecap="round" opacity="0.4"/>

  <!-- Word with emphasized first letter (smaller for long word) -->
  <text x="210" y="370" text-anchor="middle" dominant-baseline="central"
        font-size="44" font-weight="600" fill="#C2185B">
    <tspan font-weight="800" font-size="50">A</tspan>lligator
  </text>

  <!-- Simple alligator illustration -->
  <g transform="translate(210, 455)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#4CAF50"/>
    <!-- Tail -->
    <path d="M 28,0 Q 42,-4 50,-2 Q 56,0 52,4 Q 46,2 30,2 Z" fill="#388E3C"/>
    <!-- Head/snout -->
    <ellipse cx="-28" cy="-2" rx="18" ry="8" fill="#4CAF50"/>
    <ellipse cx="-42" cy="-3" rx="12" ry="4" fill="#388E3C"/>
    <!-- Upper jaw line -->
    <line x1="-54" y1="-3" x2="-30" y2="-3" stroke="#2E7D32" stroke-width="1.5"/>
    <!-- Teeth -->
    <polygon points="-50,-3 -48,-1 -46,-3" fill="white"/>
    <polygon points="-44,-3 -42,-1 -40,-3" fill="white"/>
    <polygon points="-38,-3 -36,-1 -34,-3" fill="white"/>
    <!-- Eye -->
    <circle cx="-26" cy="-7" r="4" fill="#FFF9C4"/>
    <circle cx="-26" cy="-7" r="2" fill="#1B5E20"/>
    <!-- Eye bump -->
    <ellipse cx="-26" cy="-10" rx="5" ry="3" fill="#66BB6A"/>
    <!-- Legs -->
    <rect x="-18" y="8" width="5" height="10" rx="2" fill="#388E3C"/>
    <rect x="-6" y="8" width="5" height="10" rx="2" fill="#388E3C"/>
    <rect x="8" y="8" width="5" height="10" rx="2" fill="#388E3C"/>
    <rect x="20" y="8" width="5" height="10" rx="2" fill="#388E3C"/>
    <!-- Scales -->
    <circle cx="-10" cy="-4" r="2" fill="#66BB6A" opacity="0.5"/>
    <circle cx="0" cy="-5" r="2" fill="#66BB6A" opacity="0.5"/>
    <circle cx="10" cy="-4" r="2" fill="#66BB6A" opacity="0.5"/>
    <circle cx="20" cy="-3" r="2" fill="#66BB6A" opacity="0.5"/>
  </g>
</svg>
